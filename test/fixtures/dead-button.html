<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dead Button</title>
  </head>
  <body>
    <h1>Dead Button</h1>
    <p id="marker">Nothing happens here</p>
    <!-- A button with no handler: clicking it is a no-op (no DOM change, no navigation). -->
    <button id="dead" type="button">Do nothing</button>
  </body>
</html>
