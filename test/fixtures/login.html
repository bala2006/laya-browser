<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
  </head>
  <body>
    <h1>Sign in</h1>
    <form id="login" onsubmit="return false;">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" />

      <label for="role">Role</label>
      <select id="role" name="role">
        <option value="user">User</option>
        <option value="admin">Admin</option>
        <option value="guest">Guest</option>
      </select>

      <label><input id="remember" type="checkbox" /> Remember me</label>

      <button id="submit" type="button" onclick="signIn()">Sign in</button>
    </form>

    <p id="status">Not signed in</p>

    <a id="help" href="#help">Need help?</a>

    <script>
      function signIn() {
        const email = document.getElementById("email").value;
        const status = document.getElementById("status");
        if (email) {
          status.textContent = "Signed in as " + email;
          document.title = "Signed in";
          window.location.hash = "signed-in";
        } else {
          status.textContent = "Email required";
        }
      }
    </script>
  </body>
</html>
